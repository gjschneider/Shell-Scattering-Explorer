name: Build Shell Explorer Executables

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # macos-14 guarantees an Apple Silicon (ARM64) runner
        os: [ubuntu-latest, macos-14, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy matplotlib

      - name: Compile with PyInstaller
        # The --windowed flag prevents a background terminal console from popping up
        run: pyinstaller --onefile --windowed shell_explorer.py

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: Shell-Explorer-${{ matrix.os }}
          path: dist/*

name: Build Windows Executable

# This makes the action run every time you push new code to the "main" branch
on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest # Tells GitHub to use a Windows machine

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # You can change this to match your version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # If you have other libraries, add them here (e.g., pip install requests)

      - name: Compile with PyInstaller
        # Replace 'your_script_name.py' with the actual name of your python file
        run: pyinstaller --onefile shell_explorer.py

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Executable
          path: dist/*.exe

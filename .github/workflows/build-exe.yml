name: Build Executables for All OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # This "matrix" tells GitHub to run this exact job three times, 
    # once on each of the operating systems listed below.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Add other pip installs here if your script needs them

      - name: Compile with PyInstaller
        # Replace 'your_script_name.py' with your actual file name
        run: pyinstaller --onefile shell_explorer.py

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          # This names the download file based on the OS it was built on
          name: Executable-${{ matrix.os }}
          # This grabs everything in the dist folder, regardless of file extension
          path: dist/*
